<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reiniery Agent</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="shell">
      <header>
        <div>
          <p class="eyebrow">EPSS 254 · Minimal harness</p>
          <h1>Reiniery Agent</h1>
        </div>
        <span class="status"><i></i> Local only</span>
      </header>

      <section id="chat" class="chat" aria-live="polite">
        <article class="message assistant">
          <span class="label">Agent</span>
          <p>Ready. Ask me to inspect or work with files in this folder.</p>
        </article>
      </section>

      <form id="composer" class="composer">
        <label for="message">Message</label>
        <div class="input-row">
          <textarea id="message" rows="2" placeholder="What files are in this folder?" required></textarea>
          <button id="send" type="submit">Send</button>
        </div>
      </form>
    </main>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
